name: phase0
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        preset: [dev-gcc, dev-clang, asan-ubsan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --preset ${{ matrix.preset }}
      - name: Metadata
        run: out/build/${{ matrix.preset }}/inferx-info --format=json

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - run: cmake -P tools/validate_json.cmake
      - run: tools/check_submodules.sh
      - run: tools/check_format.sh
      - run: tools/check_deviations.sh
